<!DOCTYPE html>
<html>
<head>
<title>Calculator - Auswell</title>
<style>
body{font-family:Arial;text-align:center;padding:20px;background:#f4f4f4}
.calculator{background:white;width:280px;margin:auto;padding:20px;border-radius:15px;box-shadow:0 0 10px #ccc}
input{width:90%;padding:15px;font-size:22px;text-align:right;margin-bottom:10px}
button{width:60px;height:50px;margin:5px;font-size:18px;border:none;border-radius:10px;background:#e63946;color:white;cursor:pointer}
button:hover{background:#c1121f}
</style>
</head>
<body>
<h2>Auswell Calculator</h2>
<div class="calculator">
<input type="text" id="display" readonly>
<br>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button onclick="add('+')">+</button><br>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button onclick="add('-')">-</button><br>
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button onclick="add('*')">x</button><br>
<button onclick="add('0')">0</button>
<button onclick="clearDisplay()">C</button>
<button onclick="calculate()">=</button>
<button onclick="add('/')">/</button>
</div>
<br>
<a href="index.html">← Back to Portfolio</a>
<script>
function add(v){document.getElementById('display').value+=v}
function clearDisplay(){document.getElementById('display').value=''}
function calculate(){try{document.getElementById('display').value=eval(document.getElementById('display').value)}catch(e){document.getElementById('display').value='Error'}}
</script>
</body>
</html>
